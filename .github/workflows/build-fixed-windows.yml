name: Build patched Concat Windows Setup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x86_64 installer
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      ORT_VERSION: "1.28.0"
      GGML_BACKEND_DL: "ON"
      GGML_CPU_ALL_VARIANTS: "ON"
      GGML_AVX2: "OFF"
      GGML_FMA: "OFF"
      GGML_F16C: "OFF"
      GGML_BMI2: "OFF"

    steps:
      # First check out your fork so the workflow can read the patch stored there.
      - name: Check out the fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Do not build the moving main branch. The patch was written for v0.2.12.
      # Keep the patch file in RUNNER_TEMP while switching the worktree to the
      # immutable upstream release tag, then restore the patch into that tree.
      - name: Pin source to upstream v0.2.12
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $patch = Join-Path $PWD "Concat-0.2.12-fixes.patch"
          if (-not (Test-Path $patch)) {
            throw "Concat-0.2.12-fixes.patch is missing from the fork's repository root."
          }

          $savedPatch = Join-Path $env:RUNNER_TEMP "Concat-0.2.12-fixes.patch"
          Copy-Item $patch $savedPatch -Force

          git fetch --depth=1 https://github.com/jub0t/concat.git refs/tags/v0.2.12:refs/tags/v0.2.12
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch the upstream v0.2.12 tag." }

          git checkout --detach refs/tags/v0.2.12
          if ($LASTEXITCODE -ne 0) { throw "Could not switch to upstream tag v0.2.12." }

          Copy-Item $savedPatch $patch -Force
          $sourceCommit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw "Could not identify the pinned source commit." }
          Write-Host "Using upstream Concat v0.2.12 at commit $sourceCommit."

      - name: Read and verify the source version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cargo = Get-Content "src/Cargo.toml" -Raw
          $match = [regex]::Match($cargo, '(?m)^version\s*=\s*"([^\"]+)"')
          if (-not $match.Success) { throw "Could not read the application version from src/Cargo.toml" }
          $version = $match.Groups[1].Value
          if ($version -ne "0.2.12") { throw "Expected pinned source version 0.2.12, found $version. Stop rather than build the wrong version." }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Building patched Concat $version for Windows x86_64."

      - name: Apply and validate the Auto Captions fixes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $patch = "Concat-0.2.12-fixes.patch"
          if (-not (Test-Path $patch)) { throw "$patch is missing from the repository root." }

          # The published patch has one added documentation line missing its
          # leading '+' in some copies. Correct that exact line in a temporary
          # copy; do not silently alter the patch stored in the fork.
          $patchText = [System.IO.File]::ReadAllText((Resolve-Path $patch))
          $badLine = 'If VAD has no matching region or its result is not trusted, the previous Whisper timing fallback is retained.'
          $goodLine = '+' + $badLine
          if ($patchText.Contains($badLine) -and -not $patchText.Contains($goodLine)) {
            $patchText = [regex]::Replace(
              $patchText,
              '(?m)^' + [regex]::Escape($badLine) + '\r?$',
              $goodLine
            )
          }

          $fixedPatch = Join-Path $env:RUNNER_TEMP "Concat-0.2.12-fixes.fixed.patch"
          [System.IO.File]::WriteAllText($fixedPatch, $patchText, [System.Text.UTF8Encoding]::new($false))

          git apply --check $fixedPatch
          if ($LASTEXITCODE -ne 0) { throw "The patch does not match upstream v0.2.12. No source files were changed." }
          git apply $fixedPatch
          if ($LASTEXITCODE -ne 0) { throw "Applying the Auto Captions patch failed." }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "The patched source has whitespace errors." }
          Write-Host "Patch validation and application succeeded."

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026-10-09
        with:
          toolchain: "1.93.1"
          targets: x86_64-pc-windows-msvc

      - name: Install FFmpeg development files and LLVM
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = "Stop"
          $bash = "$env:ProgramFiles\Git\bin\bash.exe"
          if (-not (Test-Path $bash)) { throw "Git Bash is missing on the Windows runner." }

          & $bash scripts/ci/fetch.sh llvm-win64 llvm.exe
          if ($LASTEXITCODE -ne 0) { throw "The pinned LLVM download failed." }
          Start-Process -Wait -FilePath .\llvm.exe -ArgumentList "/S", "/D=C:\llvm"
          if (-not (Test-Path C:\llvm\bin\libclang.dll)) { throw "LLVM did not install to C:\llvm." }
          Remove-Item .\llvm.exe -ErrorAction SilentlyContinue
          "C:\llvm\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "LIBCLANG_PATH=C:\llvm\bin" | Out-File -FilePath $env:GITHUB_ENV -Append

          & $bash scripts/ci/fetch.sh ffmpeg-win64 ffmpeg-win.zip
          if ($LASTEXITCODE -ne 0) { throw "The pinned FFmpeg download failed." }
          Expand-Archive -Path .\ffmpeg-win.zip -DestinationPath .\ffmpeg-unpacked -Force
          $ffmpeg = Get-ChildItem .\ffmpeg-unpacked -Directory | Select-Object -First 1
          if (-not $ffmpeg) { throw "The FFmpeg archive did not contain its expected folder." }
          if (-not (Test-Path (Join-Path $ffmpeg.FullName "include"))) { throw "FFmpeg headers are missing." }
          "FFMPEG_DIR=$($ffmpeg.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          (Join-Path $ffmpeg.FullName "bin") | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install ONNX Runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bash = "$env:ProgramFiles\Git\bin\bash.exe"
          & $bash scripts/ci/onnxruntime.sh win-x64
          if ($LASTEXITCODE -ne 0) { throw "The pinned ONNX Runtime download or extraction failed." }
          $ort = Join-Path $PWD "onnxruntime-win-x64-$env:ORT_VERSION"
          if (-not (Test-Path (Join-Path $ort "lib\onnxruntime.lib"))) { throw "ONNX Runtime import library is missing." }
          if (-not (Test-Path (Join-Path $ort "lib\onnxruntime.dll"))) { throw "ONNX Runtime DLL is missing." }
          "ORT_DIR=$ort" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ORT_LIB_LOCATION=$(Join-Path $ort 'lib')" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ORT_PREFER_DYNAMIC_LINK=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          (Join-Path $ort "lib") | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src
          key: x86_64-pc-windows-msvc
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST GGML ORT

      - name: Build Concat
        shell: pwsh
        timeout-minutes: 75
        run: |
          $ErrorActionPreference = "Stop"
          Push-Location src
          try {
            cargo build --profile app -p concat --target x86_64-pc-windows-msvc
            if ($LASTEXITCODE -ne 0) { throw "Cargo build failed with exit code $LASTEXITCODE." }
          }
          finally { Pop-Location }

      - name: Stage the self-contained Windows app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $name = "Concat-$env:VERSION-windows-x86_64"
          $dir = Join-Path "stage" $name
          New-Item -ItemType Directory -Force $dir | Out-Null

          $exe = "src\target\x86_64-pc-windows-msvc\app\concat.exe"
          if (-not (Test-Path $exe)) { throw "The built concat.exe was not found at $exe." }
          Copy-Item $exe $dir
          Copy-Item "$env:FFMPEG_DIR\bin\*.dll" $dir
          Copy-Item "$env:ORT_DIR\lib\*.dll" $dir

          $built = Get-ChildItem "src\target\x86_64-pc-windows-msvc\app\build\whisper-rs-sys-*\out\bin\ggml-cpu-x64.dll" |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $built) { throw "whisper-rs-sys did not produce ggml-cpu-x64.dll." }
          Write-Host "Whisper/GGML build output: $($built.DirectoryName)"
          $whisperDll = Join-Path $built.DirectoryName "whisper.dll"
          if (-not (Test-Path $whisperDll)) {
            throw "whisper.dll is missing from $($built.DirectoryName)."
          }
          Copy-Item $whisperDll $dir

          # whisper-rs-sys puts whisper.dll and all ggml*.dll files together
          # in out\bin. They are not inside an additional 'ggml' directory.
          $ggmlDlls = @(Get-ChildItem -LiteralPath $built.DirectoryName -Filter "ggml*.dll" -File)
          if ($ggmlDlls.Count -eq 0) {
            throw "No ggml*.dll files were found in $($built.DirectoryName)."
          }
          $ggmlDlls | ForEach-Object {
            Write-Host "Staging $($_.Name)"
            Copy-Item -LiteralPath $_.FullName -Destination $dir -Force
          }

          foreach ($module in "x64", "sandybridge", "haswell") {
            if (-not (Test-Path (Join-Path $dir "ggml-cpu-$module.dll"))) {
              throw "The required ggml-cpu-$module.dll module is missing."
            }
          }
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md $dir

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "Visual Studio's vswhere.exe was not found." }
          $vsResult = & $vswhere -latest -products * -property installationPath
          if ($LASTEXITCODE -ne 0) { throw "vswhere failed while locating Visual Studio." }
          $vs = [string]($vsResult | Select-Object -First 1)
          $vs = $vs.Trim()
          if (-not $vs -or -not (Test-Path -LiteralPath $vs)) { throw "vswhere could not locate the Visual Studio installation." }
          Write-Host "Visual Studio installation: $vs"

          # VS 2022 stores the x64 runtime here:
          # VC\Redist\MSVC\<version>\x64\Microsoft.VC143.CRT
          # Do not look for a Microsoft.VC14\*.CRT nested path: that folder
          # name does not exist in the current VS 2022 layout.
          $redistRoot = Join-Path $vs "VC\Redist\MSVC"
          if (-not (Test-Path -LiteralPath $redistRoot)) {
            throw "The Visual C++ redist root was not found: $redistRoot"
          }
          $crtCandidates = @(
            Get-ChildItem -LiteralPath $redistRoot -Directory -Recurse -ErrorAction Stop |
              Where-Object {
                $_.Name -match '^Microsoft\.VC\d+\.CRT$' -and
                $_.FullName -match '\\x64\\Microsoft\.VC\d+\.CRT$'
              }
          )
          if ($crtCandidates.Count -eq 0) {
            $found = Get-ChildItem -LiteralPath $redistRoot -Directory -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '^Microsoft\.VC.*\.CRT$' } |
              Select-Object -ExpandProperty FullName
            Write-Host "CRT directories found under redist root:"
            $found | ForEach-Object { Write-Host "  $_" }
            throw "The x64 Visual C++ CRT folder (for example Microsoft.VC143.CRT) was not found under $redistRoot."
          }
          $crt = $crtCandidates |
            Sort-Object -Property @{ Expression = {
              $versionFolder = Split-Path (Split-Path $_.FullName -Parent) -Leaf
              try { [version]$versionFolder } catch { [version]'0.0' }
            } } -Descending |
            Select-Object -First 1
          Write-Host "Using Visual C++ runtime folder: $($crt.FullName)"

          # Locate the x64-hosted x64 dumpbin from the installed MSVC toolset.
          $msvcTools = Join-Path $vs "VC\Tools\MSVC"
          if (-not (Test-Path -LiteralPath $msvcTools)) { throw "MSVC tools folder was not found: $msvcTools" }
          $dumpbinItem = Get-ChildItem -LiteralPath $msvcTools -Filter "dumpbin.exe" -File -Recurse -ErrorAction Stop |
            Where-Object { $_.FullName -match '\\bin\\Hostx64\\x64\\dumpbin\.exe$' } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $dumpbinItem) { throw "x64 dumpbin.exe was not found under $msvcTools." }
          $dumpbin = $dumpbinItem.FullName
          Write-Host "Using dumpbin: $dumpbin"

          # Include the Visual C++ runtime DLLs imported by the app and its DLLs.
          foreach ($pass in 1, 2) {
            $peFiles = Get-ChildItem $dir -Recurse -File | Where-Object { $_.Extension -in ".exe", ".dll" }
            foreach ($pe in $peFiles) {
              $lines = & $dumpbin /nologo /dependents $pe.FullName
              if ($LASTEXITCODE -ne 0) { throw "dumpbin failed for $($pe.Name)." }
              foreach ($line in $lines) {
                $dll = $line.Trim()
                if ($dll -match '^[A-Za-z0-9_.-]+\.dll$' -and
                    (Test-Path (Join-Path $crt.FullName $dll)) -and
                    -not (Test-Path (Join-Path $dir $dll))) {
                  Copy-Item (Join-Path $crt.FullName $dll) $dir
                }
              }
            }
          }
          Get-ChildItem $dir | Format-Table Name, Length

      - name: Smoke test the staged app
        shell: pwsh
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = "Stop"
          $name = "Concat-$env:VERSION-windows-x86_64"
          scripts/ci/smoke-windows.ps1 -Bundle "stage\$name"

      - name: Build the Setup.exe installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed." }
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup's ISCC.exe is missing." }

          $name = "Concat-$env:VERSION-windows-x86_64"
          & $iscc "/DVersion=$env:VERSION" "/DArch=x64compatible" "/DSuffix=x86_64" `
            "/DStage=$PWD\stage\$name" "/DOut=$PWD\stage" assets\windows\concat.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE." }
          $installer = "stage\$name-setup.exe"
          if (-not (Test-Path $installer)) { throw "The expected Setup.exe was not created." }
          Write-Host "Created $installer"

      - name: Upload the Windows installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Concat-0.2.12-Windows-Setup-Fixed
          path: stage/Concat-0.2.12-windows-x86_64-setup.exe
          if-no-files-found: error
          retention-days: 30
